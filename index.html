<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFD Online — Tire tes 3 questions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0a0a0a;
    --bg-2: #121212;
    --white: #f5f5f2;
    --grey: #8a8a86;
    --gold: #d4af37;
    --gold-dim: #8a7226;
    --line: rgba(245,245,242,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  body{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 20px 60px;
    position: relative;
  }

  /* ambient signal rings behind everything, echoing the wifi mark in the logo */
  .signal-field{
    position: fixed;
    top: -10%; right: -15%;
    width: 70vmax; height: 70vmax;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }
  .signal-field svg{ width:100%; height:100%; }
  .ring{
    fill:none; stroke: var(--gold-dim); stroke-width:1;
    opacity:0;
    animation: pulse 6s ease-out infinite;
  }
  .ring:nth-child(2){ animation-delay: 1.4s; }
  .ring:nth-child(3){ animation-delay: 2.8s; }
  .ring:nth-child(4){ animation-delay: 4.2s; }
  @keyframes pulse{
    0%{ opacity:0; transform: scale(0.7); transform-origin: 80% 20%; }
    15%{ opacity:0.55; }
    100%{ opacity:0; transform: scale(1.15); transform-origin: 80% 20%; }
  }

  header{
    position: relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    max-width: 560px;
  }

  .logo{
    width: 190px;
    height: auto;
    margin-bottom: 22px;
    filter: drop-shadow(0 0 18px rgba(212,175,55,0.15));
  }

  .eyebrow{
    text-transform: uppercase;
    letter-spacing: 0.28em;
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 14px;
  }

  h1{
    font-family:'Poppins', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .subtitle{
    color: var(--grey);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 8px;
  }

  .rule{
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-top: 6px;
  }

  main{
    position: relative; z-index:1;
    width: 100%;
    max-width: 560px;
    margin-top: 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* counter dots */
  .counter{
    display:flex;
    gap: 10px;
    margin-bottom: 30px;
  }
  .dot{
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-dim);
    background: transparent;
    transition: background .4s ease, border-color .4s ease, transform .3s ease;
  }
  .dot.filled{
    background: var(--gold);
    border-color: var(--gold);
    transform: scale(1.15);
  }

  /* card zone */
  .card-zone{
    width: 100%;
    min-height: 210px;
    perspective: 1400px;
    margin-bottom: 26px;
  }

  .card{
    width: 100%;
    min-height: 210px;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: linear-gradient(160deg, var(--bg-2), #0d0d0d);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 34px 30px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2,.7,.3,1), box-shadow .55s ease;
  }

  .card.dealt{
    box-shadow: 0 20px 60px -20px rgba(212,175,55,0.25);
  }

  .card::before{
    content:"";
    position:absolute; inset:0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(212,175,55,0.5), transparent 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
  }

  .card-index{
    position:absolute;
    top: 18px; left: 22px;
    font-family:'Poppins', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    font-weight: 700;
  }

  .card-text{
    font-family:'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(17px, 4vw, 21px);
    line-height: 1.45;
    color: var(--white);
  }

  .card-empty{
    color: var(--grey);
    font-size: 14px;
    line-height: 1.6;
  }
  .card-empty strong{ color: var(--white); }

  @keyframes dealIn{
    from{ opacity:0; transform: rotateY(-90deg) translateY(6px); }
    to{ opacity:1; transform: rotateY(0deg) translateY(0); }
  }
  .card.dealt .card-inner{
    animation: dealIn .6s cubic-bezier(.2,.7,.3,1);
  }

  button#draw{
    font-family:'Poppins', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.03em;
    color: #0a0a0a;
    background: linear-gradient(135deg, #e9c766, var(--gold));
    border: none;
    padding: 17px 44px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, opacity .3s ease;
    box-shadow: 0 10px 30px -8px rgba(212,175,55,0.55);
  }
  button#draw:hover:not(:disabled){ transform: translateY(-2px); }
  button#draw:active:not(:disabled){ transform: translateY(0px) scale(0.98); }
  button#draw:disabled{
    opacity: 0.35;
    cursor: default;
    box-shadow: none;
    background: var(--bg-2);
    color: var(--grey);
  }

  footer{
    position: relative; z-index:1;
    margin-top: 50px;
    color: var(--grey);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .ring{ animation: none; opacity: 0.2; }
    .card.dealt .card-inner{ animation: none; }
    button#draw:hover:not(:disabled){ transform:none; }
  }

  @media (max-width: 420px){
    .logo{ width: 150px; }
    .card{ padding: 28px 20px; min-height: 190px; }
  }
</style>
</head>

  <div class="eyebrow">MFD Online</div>
  <h1>Tire tes questions</h1>
  <p class="rule">Maximum 3 questions par personne</p>
</header>

<main>
  <div class="counter" id="counter"></div>

  <div class="card-zone">
    <div class="card" id="card">
      <div class="card-inner" id="cardInner">
        <p class="card-empty">Appuie sur <strong>Tirer une question</strong> pour commencer. Tu pourras en tirer <strong>3 au total</strong>.</p>
      </div>
    </div>
  </div>

  <button id="draw">Tirer une question</button>
</main>

<footer>MFD Online</footer>

<script>
  const QUESTIONS = [
    "Comment gères-tu les conflits ? Es-tu tolérant·e ?",
    "Qu'est-ce qui te manque le plus de ton enfance ?",
    "Qu'est-ce qu'une femme pour toi ?",
    "Dans quel(s) pays et type d'habitation aimerais-tu vivre ?",
    "Qu'effacerais-tu de ton passé ?",
    "Est-ce que tu t'aimes ? Parle-moi de ton estime de toi.",
    "Quel événement a radicalement changé ta vie ?",
    "Comment te présenterais-tu au monde ?",
    "Qu'est-ce que l'amour pour toi ?",
    "Veux-tu avoir des enfants ? Pourquoi ? Si tu en as déjà, pourquoi en voulais-tu ?",
    "Qu'est-ce que l'amitié pour toi ? Qu'es-tu prêt·e à faire pour tes ami·e·s ?",
    "Quel est le plus beau souvenir de ta vie ?",
    "Quelle est la chose la plus folle que tu aies faite dans ta vie ?",
    "Qu'est-ce qui te rendrait heureux·se tout de suite ?",
    "Quelle est ta plus grande force ?",
    "Qu'est-ce qu'un homme pour toi ?",
    "Quelle chanson te fait penser à moi (ou à nous) ?",
    "Peux-tu me parler de ton plus grand échec et de ta plus belle réussite ?",
    "Quelle est ta vision du couple ?",
    "Qu'est-ce qui n'a pas marché dans tes précédentes relations ?",
    "Quels sont tes langages de l'amour ? Par quelles attentions montres-tu ton amour et quelles attentions aimes-tu recevoir ?",
    "De quoi as-tu besoin ?",
    "Quels sont tes objectifs à court et long termes ?",
    "Quelles sont tes relations avec ta famille ? Que devrais-je savoir sur ta famille ?",
    "Te sens-tu accompli·e ? Pourquoi ?",
    "Comment vas-tu (réellement) ? Parle-moi de ta santé mentale et de ton rapport à la psychologie.",
    "Quel est ton plus grand rêve ?",
    "Sur quel(s) aspect(s) de ta vie aimerais-tu progresser ?",
    "Quel est ton rapport à l'argent ? Parle-moi de ton éducation financière. Est-ce que tu épargnes ? Te considères-tu aisé·e ou pauvre ?",
    "Quel est ton rapport à tes origines / ta culture ?",
    "As-tu peur de la mort ?",
    "Quelle est la plus belle chose que l'on t'ait faite ?",
    "Selon toi, quel est notre but sur Terre ?",
    "Avec qui peux-tu être vulnérable ? Es-tu à l'aise avec le fait de t'ouvrir à quelqu'un ?",
    "Quelle est la pire chose que l'on t'ait faite ?",
    "Raconte-moi le moment le plus gênant de ta vie.",
    "As-tu un modèle / un exemple à suivre ?",
    "Dans quel état est ton cœur ?",
    "Quel genre d'enfant étais-tu ? Raconte-moi ton plus beau souvenir d'enfance.",
    "Bonus : demande ce que tu veux à la personne de ton choix."
  ];

  const MAX_DRAWS = 3;
  let deck = [];
  let drawnCount = 0;

  const counterEl = document.getElementById('counter');
  const cardEl = document.getElementById('card');
  const cardInner = document.getElementById('cardInner');
  const drawBtn = document.getElementById('draw');

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderCounter(){
    counterEl.innerHTML = '';
    for(let i = 0; i < MAX_DRAWS; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i < drawnCount ? ' filled' : '');
      counterEl.appendChild(d);
    }
  }

  function initDeck(){
    deck = shuffle(QUESTIONS);
    drawnCount = 0;
    renderCounter();
    drawBtn.disabled = false;
    drawBtn.textContent = 'Tirer une question';
    cardEl.classList.remove('dealt');
    cardInner.innerHTML = '<p class="card-empty">Appuie sur <strong>Tirer une question</strong> pour commencer. Tu pourras en tirer <strong>3 au total</strong>.</p>';
  }

  function drawQuestion(){
    if(drawnCount >= MAX_DRAWS) return;
    const q = deck[drawnCount];
    drawnCount++;

    cardEl.classList.remove('dealt');
    void cardEl.offsetWidth; // restart animation
    cardInner.innerHTML =
      '<span class="card-index">Question ' + drawnCount + ' / ' + MAX_DRAWS + '</span>' +
      '<p class="card-text">' + q + '</p>';
    cardEl.classList.add('dealt');

    renderCounter();

    if(drawnCount >= MAX_DRAWS){
      drawBtn.disabled = true;
      drawBtn.textContent = 'Pioche terminée';
    }
  }

  drawBtn.addEventListener('click', drawQuestion);

  initDeck();
</script>
